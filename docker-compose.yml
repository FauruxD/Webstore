services:
  mysql:
    image: mysql:8.0
    container_name: digital-atelier-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: digital_atelier
      MYSQL_USER: digital_atelier
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root-password
      TZ: Asia/Jakarta
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - digital_atelier_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  digital_atelier_mysql_data:

